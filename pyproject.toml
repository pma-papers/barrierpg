[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpg"
version = "0.4.0"
description = "Reinforcement learning when a resource can run out: train any policy-gradient learner under a budget, validate the policy, report what the evidence shows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
rl = ["gymnasium>=1.0", "stable-baselines3>=2.3", "torch>=2.0"]
problems = ["gymnasium[box2d,mujoco]>=1.0"]          # the lander (Box2D) and the robot (MuJoCo); navigation needs Safety-Gymnasium separately
test = ["pytest"]
notebooks = ["jupyter", "ipykernel", "matplotlib", "nbformat", "nbclient"]
all = ["bpg[rl,problems,test,notebooks]"]

[tool.setuptools.packages.find]
include = ["bpg*"]
