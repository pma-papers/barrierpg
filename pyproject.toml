[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpg"
version = "0.3.0"
description = "Clipped barrier policy gradients under resource budgets: configure, certify and interpret a standard learner"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
rl = ["gymnasium>=1.0", "stable-baselines3>=2.3", "torch>=2.0"]
test = ["pytest"]
notebooks = ["jupyter", "ipykernel", "matplotlib", "nbformat", "nbclient"]
all = ["bpg[rl,test,notebooks]"]

[tool.setuptools.packages.find]
include = ["bpg*"]
